<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    textarea {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #4a90e2;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .stat-item {
      background: #f9f9f9;
      padding: 16px;
      border-radius: 6px;
      border-left: 4px solid #4a90e2;
      text-align: center;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 24px;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    </style>
</head>
<body>
    <h1>Word Counter</h1>
    <p>Paste or type text to count words, characters, sentences, and lines in real time.</p>

    <textarea id="text-input" placeholder="Start typing or paste your text here..."></textarea>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Words</div>
        <div class="stat-value" id="word-count">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Characters</div>
        <div class="stat-value" id="char-count">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Sentences</div>
        <div class="stat-value" id="sentence-count">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Lines</div>
        <div class="stat-value" id="line-count">0</div>
      </div>
    </div>

    <script>
    const textInput = document.getElementById('text-input');
    const wordCount = document.getElementById('word-count');
    const charCount = document.getElementById('char-count');
    const sentenceCount = document.getElementById('sentence-count');
    const lineCount = document.getElementById('line-count');

    function updateCounts() {
      const text = textInput.value;

      charCount.textContent = text.length;

      const words = text.trim() === '' ? [] : text.trim().split(/\s+/);
      wordCount.textContent = words.length;

      const sentences = text.match(/[.!?]+/g);
      sentenceCount.textContent = sentences ? sentences.length : 0;

      const lines = text === '' ? 0 : text.split('\n').length;
      lineCount.textContent = lines;
    }

    textInput.addEventListener('input', updateCounts);
    </script>
</body>
</html>
